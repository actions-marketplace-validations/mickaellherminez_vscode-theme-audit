# Runs the checks on every branch push and pull request, on Linux, Windows and
# macOS, with the two Node.js versions that the package supports, then the
# corpus test on the same systems.

name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      # Every system and version runs to the end, so that one failure does not hide another
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      - name: The built command runs
        run: node dist/cli.js --version

      - name: The package contains what it should, under its size limit
        run: node --test "test/package/*.test.ts"

      - name: The shipped action and its licenses match the sources
        run: npm run check:action

      - name: The shipped action runs without npm dependencies
        run: npm run test:action

  corpus:
    # 20 theme extensions of Open VSX at fixed versions (test/corpus/extensions.json).
    # Their .vsix files are cached, and downloaded again only when the list changes.
    # The test checks the SHA-256 of each file, from the cache or not. It runs on
    # each system, since it extracts the extensions and follows their paths.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - uses: actions/cache@v6
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('test/corpus/extensions.json') }}

      - name: Corpus test
        run: npm run test:corpus
