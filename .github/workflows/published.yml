# Checks a version of the package as users get it: installed from npm with npx, in an empty folder, on Linux,
# Windows and macOS with Node.js 22 and 24. It prints its version, then audits the 48 themes of 365 Day & Night
# (test/data/365), which pass every check.
#
# - After each release: the release workflow calls it with the tag it published.
# - By hand, on any published version: gh workflow run published.yml -f version=0.1.0
# - In a pull request that changes this file: on the latest version.

name: Published package

on:
  workflow_call:
    inputs:
      version:
        description: The version to check (0.1.0, v0.1.0 or latest)
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The version to check (0.1.0, v0.1.0 or latest)
        type: string
        default: latest
  pull_request:
    paths:
      - .github/workflows/published.yml

permissions:
  contents: read

jobs:
  npx:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
    defaults:
      run:
        shell: bash
    env:
      # A pull request has no input: it checks the latest version
      REQUESTED: ${{ inputs.version || 'latest' }}
    steps:
      # Only for the sample themes: the package itself comes from npm
      - uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: test/data/365

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: The version to check
        id: version
        run: |
          [[ "$REQUESTED" =~ ^(latest|v?[0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::Not a version: $REQUESTED"; exit 1; }
          version="${REQUESTED#v}"
          [ "$version" = latest ] && version="$(npm view vscode-theme-audit dist-tags.latest)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Checking vscode-theme-audit@$version"

      - name: npm serves it
        # A new version can take a few minutes to reach the registry
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            [ "$(npm view "vscode-theme-audit@$VERSION" version 2>/dev/null)" = "$VERSION" ] && exit 0
            sleep 20
          done
          echo "::error::npm does not serve vscode-theme-audit@$VERSION"; exit 1

      - name: npx prints the version, from an empty folder
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir empty && cd empty
          printed="$(npx --yes "vscode-theme-audit@$VERSION" --version)"
          echo "$printed"
          [ "$printed" = "$VERSION" ] || { echo "::error::npx printed $printed"; exit 1; }

      - name: npx audits the themes of 365 Day & Night
        working-directory: ${{ runner.temp }}/empty
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx --yes "vscode-theme-audit@$VERSION" "$GITHUB_WORKSPACE/test/data/365" > report.txt
          tail -n 1 report.txt
          [ "$(tail -n 1 report.txt)" = "48 themes: 0 with failures, 0 failures" ]
          npx --yes "vscode-theme-audit@$VERSION" "$GITHUB_WORKSPACE/test/data/365" --json > report.json
          node -e "const r = JSON.parse(require('fs').readFileSync('report.json', 'utf8')); if (r.format !== 1 || r.tool.version !== process.argv[1] || r.summary.themes !== 48 || r.summary.failures !== 0) process.exit(1)" "$VERSION"
